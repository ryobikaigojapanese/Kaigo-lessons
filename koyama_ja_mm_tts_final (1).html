<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日緬TTS</title>
<style>
body{background:#0b0f17;color:#fff;font-family:sans-serif;padding:20px}
.card{border:1px solid #333;padding:15px;margin-bottom:15px;border-radius:12px}
button{display:block;width:100%;margin:6px 0;padding:10px;border-radius:8px;border:none;cursor:pointer}
.jp{background:#1f2c44;color:#fff}
.mm{background:#3a2c44;color:#fff}
</style>
</head>
<body>
<div class='card'><div class='idx'>①</div>
        <button class="jp speak" data-lang="ja" data-text="乾杯！今、君は人生の">乾杯！今、君は人生の</button>
        <button class="jp speak" data-lang="ja" data-text="かんぱい いまきみは じんせいの">かんぱい いまきみは じんせいの</button>
        <button class="jp speak" data-lang="ja" data-text="かあんんぱあいい いいまあ きいみいわあ じいんんせえいいのお">かあんんぱあいい いいまあ きいみいわあ じいんんせえいいのお</button>
        <button class="mm speak" data-lang="my" data-text="ဂုဏ်ပြုပါသည်။ ယခု သင်သည် သင့်ဘဝ၏ အစိတ်အပိုင်းသစ်ကို ရင်ဆိုင်နေပါသည်။">ဂုဏ်ပြုပါသည်။ ယခု သင်သည် သင့်ဘဝ၏ အစိတ်အပိုင်းသစ်ကို ရင်ဆိုင်နေပါသည်။</button>
        </div>
<div class='card'><div class='idx'>②</div>
        <button class="jp speak" data-lang="ja" data-text="大きな 大きな 舞台に立ち">大きな 大きな 舞台に立ち</button>
        <button class="jp speak" data-lang="ja" data-text="おおきな おおきな ぶたいにたち">おおきな おおきな ぶたいにたち</button>
        <button class="jp speak" data-lang="ja" data-text="おおおおきいなあ おおおおきいなあ ぶうたあいいにいたあちい">おおおおきいなあ おおおおきいなあ ぶうたあいいにいたあちい</button>
        <button class="mm speak" data-lang="my" data-text="ကြီးမားသော စင်မြင့်ပေါ်တွင် သင် ရပ်နေပါသည်။">ကြီးမားသော စင်မြင့်ပေါ်တွင် သင် ရပ်နေပါသည်။</button>
        </div>
<div class='card'><div class='idx'>③</div>
        <button class="jp speak" data-lang="ja" data-text="遥か長い道のりを">遥か長い道のりを</button>
        <button class="jp speak" data-lang="ja" data-text="はるかながい みちのりを">はるかながい みちのりを</button>
        <button class="jp speak" data-lang="ja" data-text="はあるうかあなあがあいい みいちいのおりいおお">はあるうかあなあがあいい みいちいのおりいおお</button>
        <button class="mm speak" data-lang="my" data-text="ရှည်လျားသော လမ်းခရီးကို ဆက်လက် လျှောက်ရမည် ဖြစ်ပါသည်။">ရှည်လျားသော လမ်းခရီးကို ဆက်လက် လျှောက်ရမည် ဖြစ်ပါသည်။</button>
        </div>
<div class='card'><div class='idx'>④</div>
        <button class="jp speak" data-lang="ja" data-text="歩き始めた">歩き始めた</button>
        <button class="jp speak" data-lang="ja" data-text="あるきはじめた">あるきはじめた</button>
        <button class="jp speak" data-lang="ja" data-text="ああるうきいはあじいめえたあ">ああるうきいはあじいめえたあ</button>
        <button class="mm speak" data-lang="my" data-text="သင် စတင် လျှောက်လှမ်းခဲ့ပါသည်။">သင် စတင် လျှောက်လှမ်းခဲ့ပါသည်။</button>
        </div>
<div class='card'><div class='idx'>⑤</div>
        <button class="jp speak" data-lang="ja" data-text="君に幸せあれ！">君に幸せあれ！</button>
        <button class="jp speak" data-lang="ja" data-text="きみにしあわせあれ">きみにしあわせあれ</button>
        <button class="jp speak" data-lang="ja" data-text="きいみいにい しいああわあせえ ああれえ">きいみいにい しいああわあせえ ああれえ</button>
        <button class="mm speak" data-lang="my" data-text="သင်၏ဘဝတွင် ပျော်ရွှင်မှုများ ပြည့်စုံပါစေ။">သင်၏ဘဝတွင် ပျော်ရွှင်မှုများ ပြည့်စုံပါစေ။</button>
        </div>
<script>
const audio=new Audio();
function tts(text,lang){
 const url=`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${encodeURIComponent(text)}`;
 audio.src=url;
 audio.play();
}
document.querySelectorAll(".speak").forEach(btn=>{
 btn.addEventListener("click",()=>{
   tts(btn.dataset.text,btn.dataset.lang);
 });
});
</script>
</body>
</html>
